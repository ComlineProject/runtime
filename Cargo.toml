[workspace]
resolver = "2"
members = [
    "runtime/core",
    "runtime/conformance",
    "runtime/reference",
    "runtime-std-extra",
    "runtime/ffi",
    "runtime/ffi/bench",

    # Broken on current rustc, independent of the `no_std` rework — re-enable
    # once addressed:
    #   "runtime-langs/lua"       — `mlua` 0.9 vs the never type (`!`)
    #   "runtime-langs/lua-test"  — same
    #   "runtime/tests/provider_consumer" — `downcast_mut` on a bare trait object
    #"runtime-langs/luau"
    #"runtime-langs/python"
]
# cargo-fuzz targets: nightly only, built with `cargo +nightly fuzz`.
exclude = ["runtime/fuzz"]
# `runtime/core_no-std` removed — `comline-runtime` is now `no_std`-first with a
# `std` feature, not a parallel fork. See ComlineProject/docs → Design.

[profile.release]
opt-level = 2

# The wasm32 build of `comline-runtime-ffi`, for the JS glue:
#   cargo build -p comline-runtime-ffi --profile wasm --target wasm32-unknown-unknown
# For wasm32 only: native builds keep `release`, and the instruction-count
# benches `bench`. One codegen unit and fat LTO let the core inline into
# each export, and `release`'s `opt-level` stays: 3, "s" and "z" measured no
# faster (and "s"/"z" slower on `jsonrpc@1`). `panic = "abort"` is what
# wasm32-unknown-unknown does anyway (a panic is a trap, which poisons the
# whole instance; see runtime/ffi/src/lib.rs), so it changes nothing there.
# Never use this profile natively, where the ABI's guards need a panic to
# unwind. The measurements are in runtime/ffi/README.md; the JS instruction
# counts will settle `opt-level`.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The instruction-count benches: one codegen unit, so a change to one function
# can't move how an unrelated one is partitioned, inlined and counted.
[profile.bench]
codegen-units = 1
