[package]
name = "comline-runtime"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"


[features]
default = ["std"]

# `contract` and the `packed@1` format need only `serde`'s core traits and no
# allocation. `alloc` adds owned generated types, the frame `transport`, and
# the `serve` loop. `jsonrpc` adds the JSON-RPC framing (`framing`), which
# needs `alloc` and no `std`. `std` adds the JSON and MessagePack formats and
# the in-memory transport, plus the dylib ABI.
alloc = ["serde/alloc"]
jsonrpc = ["alloc", "dep:serde_json"]
std = [
    "alloc",
    "jsonrpc",
    "serde/std",
    # `format::Json` writes through `serde_json::to_writer`, which wants
    # `std::io`.
    "serde_json/std",
    "dep:abi_stable",
    "dep:libloading",
    "dep:rmp",
    "dep:rmp-serde",
]
# `async_connection`: an async driver for connections, on any executor. Only
# the `futures` crates; generated async code needs Rust 1.75.
async = ["std", "dep:futures-channel", "dep:futures-util"]
# Tokio's TCP as an async transport, and its clock for call timeouts.
tokio = ["async", "dep:tokio", "dep:tokio-util", "dep:bytes"]


[dependencies]
# `contract` — no_std, no alloc. `derive` is declared, not borrowed: the
# JSON-RPC framing derives `Deserialize`, and only `std`'s `abi_stable` would
# pull it in otherwise.
serde = { version = "1.0.190", default-features = false, features = ["derive"] }
bytemuck = { version = "1.14.0", features = ["derive"] }

# `jsonrpc` layer (with `std`, `serde_json/std` too)
# `float_roundtrip`: read every `f64` back exactly, not one ulp off (the
# default parser is faster but best-effort).
serde_json = { version = "1.0.108", optional = true, default-features = false, features = ["alloc", "raw_value", "float_roundtrip"] }

# `std` layer
abi_stable = { version = "0.11.2", optional = true }
libloading = { version = "0.8.0", optional = true }
rmp = { version = "0.8.12", optional = true }
rmp-serde = { version = "1.1.2", optional = true }

# `async` layer
futures-channel = { version = "0.3.31", optional = true }
futures-util = { version = "0.3.31", optional = true, default-features = false, features = ["std", "sink"] }

# `tokio` layer
bytes = { version = "1.10.0", optional = true }
tokio = { version = "1.47.0", optional = true, features = ["net", "time"] }
tokio-util = { version = "0.7.16", optional = true, features = ["codec"] }


[dev-dependencies]
serde = { version = "1.0.190", features = ["derive"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread", "time", "net"] }
# Model test of `connection::State` (`tests/state_model.rs`).
proptest = "1.5"
# Instruction-count benches (`benches/runtime.rs`). The `iai-callgrind-runner`
# binary that runs them must be this exact version too:
#   cargo install iai-callgrind-runner --version 0.16.1 --locked
iai-callgrind = "=0.16.1"


[[bench]]
name = "runtime"
harness = false
