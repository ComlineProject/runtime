[package]
name = "comline-runtime-conformance"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# The Rust runtime's conformance to the Comline specification, vendored in
# spec/: its byte-exact vectors, which every runtime - whatever its language -
# must reproduce, computed here from `comline-runtime`; see README.md.

[dependencies]
comline-runtime = { path = "../core" }
# The specification's catalog, from the vendored copy (spec/rust), so it is
# always the revision spec/REV pins: the fact names and values the profiles
# use.
comline-catalog = { path = "spec/rust" }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.108"

[dev-dependencies]
# Generated Rust uses it for fixed arrays longer than 32.
serde-big-array = "0.5"
# Property tests (`tests/properties.rs`); `PROPTEST_CASES` raises the count.
proptest = "1.5"
