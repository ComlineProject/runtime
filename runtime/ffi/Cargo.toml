[package]
name = "comline-runtime-ffi"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# The C ABI over `comline-runtime`: the handshake, envelopes, the connection
# framings, connection state and byte limits, for every language that isn't
# Rust. The same `extern "C"` functions are the exports of the wasm32 build.
# `include/comline.h` is generated from `src/` by cbindgen (`cbindgen.toml`)
# and checked in; CI's `ffi` job fails when it drifts.

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Test-only exports (`comline_test_*`): a way to make the next call on a
# handle panic, to prove the poisoning rule. Never in a release build, and
# never in the header.
test-hooks = []

[dependencies]
# No `std`, so `package_abi` (`abi_stable`, `libloading`) never enters the
# build and wasm32 works. The FFI crate itself uses `std` for
# `catch_unwind`.
comline-runtime = { path = "../core", default-features = false, features = ["alloc", "jsonrpc"] }

[dev-dependencies]
# Itself, with the test hooks on, for `tests/rules.rs`.
comline-runtime-ffi = { path = ".", features = ["test-hooks"] }
# The vectors' reader, and the codecs that encode a vector's params (codecs
# are the host's side of the boundary, not the ABI's).
comline-runtime-conformance = { path = "../conformance" }
serde_json = "1.0.108"
# `tests/differential.rs`: the ABI against `State` and the framings.
proptest = "1.5"
