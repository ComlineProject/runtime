# `include/comline.h` is generated from `src/lib.rs` with exactly this
# cbindgen, and checked in. CI's `ffi` job regenerates it and fails on any
# difference:
#   cargo install cbindgen --version 0.29.2 --locked
#   cbindgen --config cbindgen.toml --output include/comline.h
language = "C"
style = "both"
cpp_compat = true
include_guard = "COMLINE_H"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
documentation = true
documentation_style = "c"
autogen_warning = "/* Generated by cbindgen 0.29.2 from runtime/ffi/src/lib.rs. Do not edit; see runtime/ffi/cbindgen.toml. */"
header = "/* comline.h: the C ABI of comline-runtime-ffi. MPL-2.0. */"

[export]
# wasm32-only exports (`comline_wasm_reserve_*`) are for the JS glue, not C.
exclude = ["comline_wasm_reserve_in", "comline_wasm_reserve_out"]

[fn]
sort_by = "None"

[const]
sort_by = "None"
allow_static_const = false
