name: Reports

# Observatory reports: sizes, coverage and compile time of the runtime.
# Each job writes one JSON report and uploads it; the `publish` job commits
# them all to the `reports` branch, only from `main` or a manual run. On a
# pull request it runs only when this workflow changes (everything but the
# publish, so the change is proven before it merges); a push to the default
# branch measures every change.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/reports.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: size
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: rustc
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cargo build --locked -p comline-runtime-ffi --release
          cargo build --locked -p comline-runtime-ffi --profile wasm --target wasm32-unknown-unknown
      - uses: ComlineProject/observatory/.github/actions/report-size@6544a11bdfb9e4def0a64d6cff1cf8c3df464951 # v1
        with:
          output: reports/rust.size.json
          toolchain: ${{ steps.rustc.outputs.version }}
          artifacts: |
            ffi/cdylib/x86_64-linux-release=target/release/libcomline_runtime_ffi.so
            ffi/staticlib/x86_64-linux-release=target/release/libcomline_runtime_ffi.a
            ffi/wasm32=target/wasm32-unknown-unknown/wasm/comline_runtime_ffi.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-size
          path: reports/rust.size.json
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ComlineProject/observatory/.github/actions/report-rust-coverage@6544a11bdfb9e4def0a64d6cff1cf8c3df464951 # v1
        with:
          output: reports/rust.coverage.json
          args: --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-coverage
          path: reports/rust.coverage.json
          if-no-files-found: error

  compile:
    name: compile time
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ComlineProject/observatory/.github/actions/report-rust-compile@6544a11bdfb9e4def0a64d6cff1cf8c3df464951 # v1
        with:
          output: reports/rust.compile.json
          args: --workspace --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-compile
          path: reports/rust.compile.json
          if-no-files-found: error

  publish:
    name: publish
    needs: [size, coverage, compile]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job pushes to the reports branch with the checkout's token.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - uses: ComlineProject/observatory/.github/actions/publish-report@6544a11bdfb9e4def0a64d6cff1cf8c3df464951 # v1
        with:
          reports: reports/rust.size.json reports/rust.coverage.json reports/rust.compile.json
          readme: .github/reports-branch.md
