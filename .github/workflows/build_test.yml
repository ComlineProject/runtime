name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    env:
      # The root rust-toolchain.toml pins a toolchain and overrides
      # `rustup default`; this variable overrides the file in turn.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # Cargo.lock is committed and must match the manifests: every build
      # below, and every other workflow, resolves from it.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo test --verbose -p comline-runtime --features tokio

  # `comline-runtime` without `std`: the `alloc` tier, and `alloc` plus the
  # JSON-RPC framing, built for wasm32 (no `std` there to lean on) and tested
  # on the host.
  wasm32_core:
    name: wasm32 core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the root rust-toolchain.toml's.
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose -p comline-runtime --no-default-features --features alloc,jsonrpc --target wasm32-unknown-unknown
      - run: cargo test --verbose -p comline-runtime --no-default-features --features alloc,jsonrpc
      - run: cargo build --verbose -p comline-runtime --no-default-features --features alloc --target wasm32-unknown-unknown
      - run: cargo test --verbose -p comline-runtime --no-default-features --features alloc

  # `comline-runtime-ffi`, the C ABI: `include/comline.h` matches what the
  # pinned cbindgen generates from the source, and the crate builds as a
  # cdylib and a staticlib natively and as a wasm32 module. The conformance
  # vectors are replayed through it from Rust (`cargo test`), from C against
  # the staticlib and the cdylib (gcc, and ASan + UBSan), and from Node
  # against the wasm32 build, each on the same cases. The Node tests also
  # hold the JS glue to its own rules: a trap poisons the instance (against
  # a `test-hooks` wasm32 build), one crossing per call, and `encodeBound`.
  ffi:
    name: ffi
    runs-on: ubuntu-latest
    env:
      # Keep in step with runtime/ffi/cbindgen.toml.
      CBINDGEN_VERSION: 0.29.2
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the root rust-toolchain.toml's.
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked
      - name: comline.h matches the source
        working-directory: runtime/ffi
        run: |
          cbindgen --config cbindgen.toml --output include/comline.h
          git diff --exit-code -- include/comline.h || {
            echo "::error file=runtime/ffi/include/comline.h::comline.h is out of date: run cbindgen --config cbindgen.toml --output include/comline.h in runtime/ffi (cbindgen $CBINDGEN_VERSION)"
            exit 1
          }
      - name: cdylib and staticlib
        run: |
          cargo build --verbose -p comline-runtime-ffi --release
          ls -l target/release/libcomline_runtime_ffi.so target/release/libcomline_runtime_ffi.a
      - name: wasm32
        run: |
          cargo build --verbose -p comline-runtime-ffi --profile wasm --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/wasm/comline_runtime_ffi.wasm
      # Into a target directory of its own, so it doesn't replace the build
      # above; js/test/poison.test.mjs looks for it there.
      - name: wasm32 with test hooks
        run: |
          cargo build --verbose -p comline-runtime-ffi --profile wasm --target wasm32-unknown-unknown --features test-hooks --target-dir target/test-hooks
          ls -l target/test-hooks/wasm32-unknown-unknown/wasm/comline_runtime_ffi.wasm
      - run: cargo test --verbose -p comline-runtime-ffi
      - name: export the vectors for C and Node
        run: cargo run -p comline-runtime-ffi --example export_vectors -- target/ffi-vectors
      - name: C harness (staticlib, cdylib, sanitizers)
        run: make -C runtime/ffi/tests/c check CC=gcc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node harness (wasm32)
        run: node --test runtime/ffi/js/test/*.test.mjs

  # The C ABI under Miri: the replay and the rule tests, checked for
  # undefined behaviour at the `extern "C"` boundary (aliasing, bounds,
  # leaks, panics caught at the boundary).
  ffi_miri:
    name: ffi miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test -p comline-runtime-ffi --features test-hooks
