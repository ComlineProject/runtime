name: Benchmarks

# The instruction-count gate: every bench target, run on the pull request's
# base and then on its head in the same job, on the same machine. Instruction
# counts are deterministic, so a fine limit holds without flaking. The
# comparison goes to the job summary, and the head's counts to the
# `rust.bench.json` artifact.
#
# The targets are listed in one place, `TARGETS` in
# .github/scripts/bench-report.py (`bench-report.py --targets` prints them):
# the runtime's (runtime/core/benches/runtime.rs) and the C ABI's
# (runtime/ffi/bench/benches/ffi.rs). Every one is gated alike, against the
# same limit and ledger, and its benchmark ids are qualified by the target's
# name (`ffi/...`), except the runtime's, which are the shared definitions'.
# The base runs the targets its own script lists, so a target the head drops
# is noticed like any benchmark it stops running; a target the base doesn't
# have yet (the pull request that adds it) is recorded only, as is everything
# when the base has no benches at all. The job summary also pairs each C ABI
# call with the same work on the core directly: the crossing cost, which
# informs and isn't gated on its own.
#
# Accepting a regression: a benchmark that grows past the limit fails, unless
# the pull request appends an `[[accepted]]` entry for it to the ledger,
# runtime/core/benches/accepted-regressions.toml (one for every target),
# naming the benchmark, the
# most it may grow, and why. Likewise a benchmark the base had and the head
# doesn't run fails, unless the pull request appends a `[[removed]]` entry;
# one with `renamed_to` is compared under its new id against its old count,
# so a rename is gated like anything else. A new benchmark has nothing to
# regress from, and is recorded only. Entries are part of the diff, so
# they're reviewed and stay in history; they count only in the pull request
# that adds them (`pr` must be its number), cover only what they name, and
# must be used. The job summary lists them with their counts, and each is
# annotated on the diff. Nothing is accepted by a label, a setting or a
# default. See CONTRIBUTING.md.
#
# Not the org's reusable bench workflow: valgrind needs the container started
# with `--security-opt seccomp=unconfined`, and that workflow has no input for
# container options. The jobs below are its steps, in the same image.
#
# Plain `pull_request`, not `pull_request_target`: a fork's pull request runs
# with a read-only token and no secrets, and the acceptance it can carry is
# its own diff, which a maintainer reviews before merging.
#
# Publishing: on every push to `main`, the `main` job benches the new head's
# targets alone (nothing to gate) and commits its `rust.bench.json` to the `reports`
# branch, which the docs fetch from; see the shared publish-report action (ComlineProject/observatory).
# Only that job can write, and only from `main`: a manual run from another
# branch builds the report and does a dry run of the publish.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The CI image's toolchain, whatever the root rust-toolchain.toml (and the
  # base's, which a pull request's base may still pin differently) says: base
  # and head are built by the same compiler, and the file's clippy and rustfmt
  # aren't fetched. The image has iai-callgrind-runner 0.16.1, which must
  # match the `iai-callgrind` dev-dependency of every bench target
  # (runtime/core/Cargo.toml, runtime/ffi/bench/Cargo.toml).
  RUSTUP_TOOLCHAIN: stable
  # A benchmark fails when its instruction count grows by more than this many
  # percent, unless the ledger accepts it (see the top). Measured when the
  # gate was set up: the same commit, run twice, differs by 0 instructions on
  # every benchmark, and with one codegen unit
  # (`[profile.bench]` in Cargo.toml) a change to one function leaves the
  # others' counts alone. 1% is above that, and catches a few instructions on
  # the smallest benchmarks.
  BENCH_LIMIT_PERCENT: 1
  # The ledger of accepted regressions (see the top).
  LEDGER: runtime/core/benches/accepted-regressions.toml
  # Base and head build into separate target directories: in a shared one,
  # Cargo names a workspace's path packages the same from either checkout, and
  # the head's older source mtimes make it reuse the base's build. On a pull
  # request both are in $RUNNER_TEMP, with paths of the same length (see
  # "Bench the head"). They share
  # iai-callgrind's output directory, where it keeps the base's counts for the
  # head to compare with. (CARGO_TARGET_DIR and IAI_CALLGRIND_HOME are set by
  # each job's Settings step: `github.workspace` is the host's path, not the
  # container's.)


jobs:
  # In the bench image (valgrind 3.24, iai-callgrind-runner 0.16.1, the stable
  # toolchain, python3). The container's seccomp profile is off, which valgrind
  # needs. No harden-runner here: it hardens the VM, not a job container.
  instructions:
    name: instruction counts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/comlineproject/ci-bench@sha256:0b1226fbc0867f4042a9af87b57311a259f12c5308a62469c4efd24fc0f78382
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Settings
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$RUNNER_TEMP/base"
          echo "IAI_CALLGRIND_HOME=$GITHUB_WORKSPACE/target-iai" >> "$GITHUB_ENV"

      - name: Toolchain
        id: toolchain
        # The image's; base and head build with the same one.
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Bench the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          # The base's own targets. A base from before the list had the
          # runtime's alone, or, earlier still, no benches.
          if ! python3 .github/scripts/bench-report.py --targets > "$RUNNER_TEMP/base-targets" 2>/dev/null; then
            if [ -f runtime/core/benches/runtime.rs ]; then
              echo "comline-runtime runtime" > "$RUNNER_TEMP/base-targets"
            else
              : > "$RUNNER_TEMP/base-targets"
            fi
          fi
          if [ ! -s "$RUNNER_TEMP/base-targets" ]; then
            echo "The base ($BASE_SHA) has no benches; recording head only."
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t targets < "$RUNNER_TEMP/base-targets"
          for target in "${targets[@]}"; do
            read -r package bench <<< "$target"
            echo "::group::Base: $package --bench $bench"
            CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" cargo bench -p "$package" --bench "$bench" -- \
              --save-baseline=base --save-summary=json
            echo "::endgroup::"
          done
          # The base's own summaries, kept apart from the head's: they say
          # which benchmarks the base had, so one the head drops or renames
          # is noticed, and give a renamed one its old count.
          mkdir -p "$RUNNER_TEMP/base-iai"
          (cd "$IAI_CALLGRIND_HOME" && find . -name summary.json -exec cp --parents {} "$RUNNER_TEMP/base-iai" \;)
          echo "compare=true" >> "$GITHUB_OUTPUT"

      - name: Bench the head
        env:
          COMPARE: ${{ steps.base.outputs.compare }}
        run: |
          find "$IAI_CALLGRIND_HOME" -name summary.json -delete 2>/dev/null || true
          # Beside the base's, and as long a path: a bench binary's path is
          # in its arguments, and its length moves the heap, which moves some
          # counts by a few instructions (16 of the ffi target's 102, when
          # measured with paths 16 bytes apart). Same length, same counts.
          export CARGO_TARGET_DIR="$RUNNER_TEMP/head-target"
          # No --callgrind-limits: the gate is the Report step's, which knows
          # the ledger. So this step fails only when a benchmark can't run.
          # A target the base ran is compared with its baseline; one the base
          # doesn't have is recorded only.
          listed=$(python3 .github/scripts/bench-report.py --targets)
          mapfile -t targets <<< "$listed"
          for target in "${targets[@]}"; do
            read -r package bench <<< "$target"
            echo "::group::Head: $package --bench $bench"
            if [ "$COMPARE" = "true" ] && grep -qxF "$target" "$RUNNER_TEMP/base-targets"; then
              cargo bench -p "$package" --bench "$bench" -- --baseline=base --save-summary=json
            else
              echo "The base doesn't have this target; recording head only."
              cargo bench -p "$package" --bench "$bench" -- --save-summary=json
            fi
            echo "::endgroup::"
          done

      - name: Report and gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
        run: |
          # The base's ledger tells this pull request's entries from history;
          # a base without one has none. The script's exit status is the
          # verdict, given after the summary is written.
          set +e
          python3 .github/scripts/bench-report.py \
            --home "$IAI_CALLGRIND_HOME" \
            --commit "$HEAD_SHA" \
            --toolchain "$TOOLCHAIN" \
            --limit "$BENCH_LIMIT_PERCENT" \
            --pr "$PR" \
            --base-home "$RUNNER_TEMP/base-iai" \
            --ledger "$LEDGER" \
            --base-ledger "$RUNNER_TEMP/base/$LEDGER" \
            --report runtime/conformance/reports/rust.bench.json \
            --markdown "$RUNNER_TEMP/bench.md"
          verdict=$?
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != 0 ]; then
            echo "::error::The instruction-count gate failed; see the job summary."
          fi
          exit "$verdict"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('runtime/conformance/reports/rust.bench.json') != ''
        with:
          name: rust.bench.json
          path: runtime/conformance/reports/rust.bench.json

  main:
    name: publish instruction counts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    container:
      image: ghcr.io/comlineproject/ci-bench@sha256:0b1226fbc0867f4042a9af87b57311a259f12c5308a62469c4efd24fc0f78382
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish checks the report is newer than the published one.
          fetch-depth: 0
          # This job pushes to the reports branch with the checkout's token.
          persist-credentials: true

      - name: Settings
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "IAI_CALLGRIND_HOME=$GITHUB_WORKSPACE/target-iai" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"

      - name: Toolchain
        id: toolchain
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Bench
        run: |
          listed=$(python3 .github/scripts/bench-report.py --targets)
          mapfile -t targets <<< "$listed"
          for target in "${targets[@]}"; do
            read -r package bench <<< "$target"
            echo "::group::$package --bench $bench"
            cargo bench -p "$package" --bench "$bench" -- --save-summary=json
            echo "::endgroup::"
          done

      - name: Report
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
        run: |
          python3 .github/scripts/bench-report.py \
            --home "$IAI_CALLGRIND_HOME" \
            --commit "$GITHUB_SHA" \
            --toolchain "$TOOLCHAIN" \
            --report runtime/conformance/reports/rust.bench.json \
            --markdown "$RUNNER_TEMP/bench.md"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust.bench.json
          path: runtime/conformance/reports/rust.bench.json

      - name: Publish to the reports branch
        uses: ComlineProject/observatory/.github/actions/publish-report@8d21b1fbe68f8b639676153ce1a308eaafdcc6a7 # v1
        with:
          reports: runtime/conformance/reports/rust.bench.json
          readme: .github/reports-branch.md
          dry-run: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}
