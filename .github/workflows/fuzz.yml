name: Fuzz

# The cargo-fuzz targets in runtime/fuzz, and the property tests at a high
# case count. A pull request runs each target for a minute, seeded from the
# conformance vectors. The nightly run gives each target ten minutes from a
# corpus cached between runs, runs proptest with 100000 cases, and opens an
# issue on a failure instead of blocking anyone's pull request.
# See runtime/fuzz/README.md.
#
# Every run writes `rust.fuzz.json` (runs, corpus, findings per target, and
# the property tests' verdicts; format in runtime/fuzz/README.md) as an
# artifact and to its summary. A run on `main` (the nightly, or a manual one)
# also commits it to the `reports` branch, which the docs fetch from; see
# .github/scripts/publish-report.py. Only the `publish` job can write, and
# never on a pull request; other runs do a dry run of the publish.

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly; this overrides any rust-toolchain file.
  RUSTUP_TOOLCHAIN: nightly
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_no_panic
          - packed_canonical
          - framing_decode
          - seed_vs_derive
          - stream_split
    env:
      NIGHTLY: ${{ github.event_name != 'pull_request' }}
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal

      - name: Cache cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      - name: Cache the corpus
        if: env.NIGHTLY == 'true'
        uses: actions/cache@v4
        with:
          path: runtime/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed the corpus from the vectors
        run: sh runtime/fuzz/seed-corpus.sh

      - name: Build
        id: build
        run: |
          cargo fuzz build --fuzz-dir runtime/fuzz ${{ matrix.target }}
          echo "toolchain=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Fuzz for ${{ env.SECONDS_PER_TARGET }}s
        id: run
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          trap 'echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"' EXIT
          cargo fuzz run --fuzz-dir runtime/fuzz ${{ matrix.target }} -- \
            -max_total_time=${{ env.SECONDS_PER_TARGET }} \
            -rss_limit_mb=2048 -malloc_limit_mb=512 -print_final_stats=1 \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      # Before minimizing, which adds its own files next to the finding.
      - name: Record the run
        if: always() && steps.build.outcome == 'success'
        run: >
          python3 .github/scripts/fuzz-report.py target
          --name ${{ matrix.target }}
          --toolchain "${{ steps.build.outputs.toolchain }}"
          --log "$RUNNER_TEMP/fuzz.log"
          --corpus runtime/fuzz/corpus/${{ matrix.target }}
          --artifacts runtime/fuzz/artifacts/${{ matrix.target }}
          --wall-seconds "${{ steps.run.outputs.seconds || 0 }}"
          --out "$RUNNER_TEMP/stats/${{ matrix.target }}.json"
      - if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-stats-${{ matrix.target }}
          path: ${{ runner.temp }}/stats

      - name: Minimize the crash
        if: failure()
        run: |
          for crash in runtime/fuzz/artifacts/${{ matrix.target }}/*; do
            [ -f "$crash" ] || continue
            cargo fuzz tmin --fuzz-dir runtime/fuzz ${{ matrix.target }} "$crash" -r 2000 || true
          done
      - name: Upload the crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: runtime/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Open an issue
        if: failure() && env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Nightly fuzzing failed: ${{ matrix.target }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json title --jq "map(select(.title == env.TITLE)) | length")
          if [ "$open" != "0" ]; then
            echo "An issue titled '$TITLE' is already open."
            exit 0
          fi
          {
            echo "The nightly fuzz run failed: $RUN"
            echo
            echo "The crash and its minimized form are the run's \`fuzz-${{ matrix.target }}\` artifact. As hex:"
            echo
            for crash in runtime/fuzz/artifacts/${{ matrix.target }}/*; do
              [ -f "$crash" ] || continue
              echo "- \`$(basename "$crash")\`: \`$(od -An -v -tx1 "$crash" | tr -d ' \n' | cut -c1-2000)\`"
            done
            echo
            echo "Reproduce with \`cargo +nightly fuzz run --fuzz-dir runtime/fuzz ${{ matrix.target }} <file>\`."
            echo "A real bug becomes a \`found-*\` vector; see runtime/fuzz/README.md."
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md

  properties:
    name: proptest (100000 cases)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - name: Property tests
        id: properties
        shell: bash
        env:
          PROPTEST_CASES: "100000"
        run: |
          set -o pipefail
          cargo test --release -p comline-runtime-conformance --test properties \
            2>&1 | tee "$RUNNER_TEMP/proptest.log"
      - name: Record the run
        if: always()
        run: >
          python3 .github/scripts/fuzz-report.py proptest
          --log "$RUNNER_TEMP/proptest.log" --cases 100000
          --out "$RUNNER_TEMP/stats/proptest.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-stats-proptest
          path: ${{ runner.temp }}/stats
      - name: Upload the failing seeds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: runtime/conformance/tests/properties.proptest-regressions
          if-no-files-found: ignore
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Nightly property tests failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json title --jq "map(select(.title == env.TITLE)) | length")
          if [ "$open" != "0" ]; then
            echo "An issue titled '$TITLE' is already open."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body \
            "The nightly proptest run (PROPTEST_CASES=100000) failed: $RUN. The minimal failing input is in the job log; the seed is the run's \`proptest-regressions\` artifact."

  report:
    name: fuzz report
    needs: [fuzz, properties]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The dry run checks the report is newer than the published one.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-stats-*
          path: ${{ runner.temp }}/stats
      - name: Report
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/fuzz-report.py combine \
            --commit "$COMMIT" --run "$RUN" \
            --fragments "$RUNNER_TEMP/stats" \
            --expect decode_no_panic packed_canonical framing_decode seed_vs_derive stream_split \
            --report runtime/conformance/reports/rust.fuzz.json \
            --markdown "$RUNNER_TEMP/fuzz.md"
          cat "$RUNNER_TEMP/fuzz.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust.fuzz.json
          path: runtime/conformance/reports/rust.fuzz.json
      - name: Publish (dry run)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: >
          python3 .github/scripts/publish-report.py --dry-run
          --readme .github/reports-branch.md
          runtime/conformance/reports/rust.fuzz.json

  publish:
    name: publish fuzz report
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fuzz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rust.fuzz.json
          path: ${{ runner.temp }}/report
      - name: Publish to the reports branch
        run: >
          python3 .github/scripts/publish-report.py
          --readme .github/reports-branch.md
          "$RUNNER_TEMP/report/rust.fuzz.json"
